name: hammerhead-app
region: nyc
features:
  - buildpack-stack=ubuntu-22
domains:
  - domain: yourmove.fun
    type: PRIMARY
  - domain: pawnd.dusty.wtf
    type: ALIAS

services:
  - name: tinychess
    github:
      repo: dustywusty/tinychess
      branch: main
      deploy_on_push: false
    source_dir: /
    dockerfile_path: Dockerfile
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /healthz
    envs:
      - key: PORT
        scope: RUN_TIME
        value: "8080"

static_sites:
  - name: frontend
    github:
      repo: dustywusty/tinychess
      branch: main
      deploy_on_push: false
    source_dir: /frontend
    environment_slug: html
    output_dir: .
    index_document: index.html
    catchall_document: game.html

ingress:
  rules:
    - match:
        path:
          prefix: /api
      component:
        name: tinychess
        preserve_path_prefix: true
    - match:
        path:
          prefix: /
      component:
        name: frontend

alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
