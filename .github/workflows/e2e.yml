name: E2E

on:
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Run e2e tests
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          CHROMEDP_NO_SANDBOX: "1"
          E2E_RECORD: "1"
          E2E_RECORD_FORMAT: gif
          E2E_RECORD_FPS: "6"
        run: make test-e2e
      - name: Upload e2e gifs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-gifs
          path: e2e-artifacts
          if-no-files-found: warn
          retention-days: 7
      - name: Comment with e2e artifacts
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const marker = "<!-- e2e-gifs -->";
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const run_id = context.runId;
            const artifactsUrl = `https://github.com/${owner}/${repo}/actions/runs/${run_id}#artifacts`;
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner,
              repo,
              run_id,
              per_page: 100,
            });
            const lines = data.artifacts.length
              ? data.artifacts.map((artifact) => `- ${artifact.name}`)
              : ["- (no artifacts found)"];
            const body = [
              marker,
              "E2E gifs are available as workflow artifacts:",
              artifactsUrl,
              "",
              "Artifacts:",
              ...lines,
            ].join("\n");
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
