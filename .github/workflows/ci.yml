name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

# Cancel superseded PR checks, but let an active production deployment finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tinychess_test
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: tinychess_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U tinychess_test -d tinychess_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Arasan assets
        uses: ./.github/actions/build-engine
      - name: Build web and shared packages
        run: pnpm build
      - name: Test real Arasan runtime
        run: pnpm engine:test
      - name: Typecheck web, mobile, and shared packages
        run: pnpm typecheck
      - name: Test shared chess logic and mobile utilities
        run: pnpm test
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go build ./...
      - run: go test -race ./...
        env:
          TEST_DATABASE_URL: postgres://tinychess_test:test_only@localhost:5432/tinychess_test?sslmode=disable
      - uses: browser-actions/setup-chrome@v1
      - name: Browser regressions with real computer opponents
        run: bash scripts/browser-regressions.sh
      - name: Check the frontend export
        run: |
          test -s web/dist/index.html
          test -s web/dist/arasan/arasan.wasm
          test -s web/dist/arasan/worker.js
      - name: Package and test the frontend image
        run: |
          docker build --platform linux/amd64 --file Dockerfile.static \
            --build-arg COMMIT="$GITHUB_SHA" --tag tinychess-frontend:ci web/dist
          docker build --platform linux/amd64 --file Dockerfile.frontend-prebuilt \
            --build-arg FRONTEND_IMAGE=tinychess-frontend:ci --tag tinychess-frontend:extracted .
          container_id=$(docker create tinychess-frontend:extracted /unused)
          trap 'docker rm "$container_id"' EXIT
          docker cp "$container_id:/site" "$RUNNER_TEMP/frontend-extracted"
          diff --recursive web/dist "$RUNNER_TEMP/frontend-extracted"
          docker save tinychess-frontend:ci | gzip > "$RUNNER_TEMP/frontend-linux-amd64.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-linux-amd64
          path: ${{ runner.temp }}/frontend-linux-amd64.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: |
            web/test-results
            apps/mobile/test-results
            ${{ runner.temp }}/bot-*.log
          retention-days: 7
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: docker/setup-buildx-action@v4
      - name: Build backend image once
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: tinychess:ci
          build-args: COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Test backend image
        run: bash scripts/smoke-image.sh tinychess:ci
      - name: Check deployment configuration
        env:
          TINYCHESS_IMAGE: tinychess:ci
          DOMAIN: chess.example.com
        run: |
          docker compose -f deploy/compose.yml config --quiet
          docker run --rm --env DOMAIN --mount type=bind,source="$PWD/deploy/Caddyfile",target=/etc/caddy/Caddyfile,readonly caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Test deployment scripts
        run: |
          python3 -m pip install --disable-pip-version-check PyYAML==6.0.3
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2
        with:
          no_auth: true
          version: 1.168.0
      - name: Check App Platform spec schemas
        run: |
          doctl apps spec validate .do/app.yaml --schema-only
          python3 scripts/render-app-spec.py \
            --backend "ghcr.io/dustywusty/tinychess@sha256:$(printf '%064d' 1)" \
            --frontend "ghcr.io/dustywusty/tinychess@sha256:$(printf '%064d' 2)" \
            --output "$RUNNER_TEMP/app-images.yaml"
          doctl apps spec validate "$RUNNER_TEMP/app-images.yaml" --schema-only
      - name: Export the tested backend image
        run: docker save tinychess:ci | gzip > "$RUNNER_TEMP/tinychess-linux-amd64.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: tinychess-linux-amd64
          path: ${{ runner.temp }}/tinychess-linux-amd64.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    name: Publish tested images
    needs: [go, docker]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      backend: ${{ steps.images.outputs.backend }}
      frontend: ${{ steps.images.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tinychess-linux-amd64
          path: ${{ runner.temp }}/backend
      - uses: actions/download-artifact@v4
        with:
          name: frontend-linux-amd64
          path: ${{ runner.temp }}/frontend
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested backend and frontend
        id: images
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          backend_tag="$image:deploy-$GITHUB_SHA"
          frontend_tag="$image:frontend-$GITHUB_SHA"
          docker load --input "$RUNNER_TEMP/backend/tinychess-linux-amd64.tar.gz"
          docker tag tinychess:ci "$backend_tag"
          docker load --input "$RUNNER_TEMP/frontend/frontend-linux-amd64.tar.gz"
          docker tag tinychess-frontend:ci "$frontend_tag"
          docker push "$backend_tag"
          docker push "$frontend_tag"
          backend_ref=$(docker inspect --format '{{index .RepoDigests 0}}' "$backend_tag")
          frontend_ref=$(docker inspect --format '{{index .RepoDigests 0}}' "$frontend_tag")
          echo "backend=$backend_ref" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend_ref" >> "$GITHUB_OUTPUT"
          echo "Backend: $backend_ref" >> "$GITHUB_STEP_SUMMARY"
          echo "Frontend: $frontend_ref" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to DigitalOcean
    needs: [publish]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: digitalocean-production
      cancel-in-progress: false
    env:
      DIGITALOCEAN_APP_ID: ${{ vars.DIGITALOCEAN_APP_ID }}
      BACKEND_IMAGE: ${{ needs.publish.outputs.backend }}
      FRONTEND_IMAGE: ${{ needs.publish.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - name: Check whether this commit is still current
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$latest_sha" = "$GITHUB_SHA" ]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
            echo 'Skipping deployment because main has a newer commit.'
          fi
      - name: Install doctl
        if: steps.current.outputs.deploy == 'true'
        uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          version: 1.168.0
      - name: Render the app spec with tested image digests
        if: steps.current.outputs.deploy == 'true'
        run: |
          python3 -m pip install --disable-pip-version-check PyYAML==6.0.3
          python3 scripts/render-app-spec.py --backend "$BACKEND_IMAGE" \
            --frontend "$FRONTEND_IMAGE" --output "$RUNNER_TEMP/app-images.yaml"
      - uses: actions/upload-artifact@v4
        if: steps.current.outputs.deploy == 'true'
        with:
          name: deployed-app-spec
          path: ${{ runner.temp }}/app-images.yaml
          retention-days: 30
      - name: Validate the app update
        if: steps.current.outputs.deploy == 'true'
        run: |
          test -n "$DIGITALOCEAN_APP_ID"
          doctl apps propose --app "$DIGITALOCEAN_APP_ID" --spec "$RUNNER_TEMP/app-images.yaml"
      - name: Deploy and wait for completion
        if: steps.current.outputs.deploy == 'true'
        run: |
          doctl apps update "$DIGITALOCEAN_APP_ID" \
            --spec "$RUNNER_TEMP/app-images.yaml" --wait
      - name: Check the deployed API
        if: steps.current.outputs.deploy == 'true'
        run: |
          app_url=$(doctl apps get "$DIGITALOCEAN_APP_ID" --format DefaultIngress --no-header)
          curl --fail --retry 5 --retry-delay 5 "$app_url/api/version" > "$RUNNER_TEMP/deployed-version.json"
          jq --exit-status --arg commit "$GITHUB_SHA" '.commit == $commit' "$RUNNER_TEMP/deployed-version.json"
          curl --fail --retry 5 --retry-delay 5 "$app_url/" > /dev/null
          echo "Deployment completed: $app_url" >> "$GITHUB_STEP_SUMMARY"
