name: CI

on:
  push:
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tinychess_test
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: tinychess_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U tinychess_test -d tinychess_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build web and shared packages
        run: pnpm build
      - name: Typecheck web, mobile, and shared packages
        run: pnpm typecheck
      - name: Test shared chess logic and mobile utilities
        run: pnpm test
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go build ./...
      - run: go test -race ./...
        env:
          TEST_DATABASE_URL: postgres://tinychess_test:test_only@localhost:5432/tinychess_test?sslmode=disable
