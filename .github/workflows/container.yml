name: Container

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm test && pnpm build
      - run: go test ./...
      - uses: docker/setup-buildx-action@v4
      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: tinychess:ci
          build-args: COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Test container
        run: bash scripts/smoke-image.sh tinychess:ci
      - name: Check deployment configuration
        env:
          TINYCHESS_IMAGE: tinychess:ci
          DOMAIN: chess.example.com
        run: |
          docker compose -f deploy/compose.yml config --quiet
          docker run --rm --env DOMAIN --mount type=bind,source="$PWD/deploy/Caddyfile",target=/etc/caddy/Caddyfile,readonly caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - uses: digitalocean/action-doctl@v2
        with:
          no_auth: true
      - name: Check App Platform spec schema
        run: doctl apps spec validate .do/app.yaml --schema-only
      - name: Export test image
        run: docker save tinychess:ci | gzip > tinychess-linux-amd64.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: tinychess-linux-amd64
          path: tinychess-linux-amd64.tar.gz
          retention-days: 7
          compression-level: 0

  publish:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=sha,format=long
            type=semver,pattern={{version}}
            type=raw,value=edge,enable={{is_default_branch}}
      - name: Publish AMD64 and ARM64 images
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record immutable image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "Deploy image \`$IMAGE@$DIGEST\`. See docs/deployment.md for deployment and APK instructions." >> "$GITHUB_STEP_SUMMARY"
